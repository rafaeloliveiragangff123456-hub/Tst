
name: Gerar APK de produção

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK ok: $ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar keystore de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltou o secret KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/botsync.jks"

      - name: Calcular impressões digitais do certificado
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          OUT=$(keytool -list -v -keystore "$RUNNER_TEMP/botsync.jks" -storepass "$KS_PASS" -alias "${KS_ALIAS:-botsync}")
          SHA256=$(echo "$OUT" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          SHA1=$(echo "$OUT" | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          echo "BOTSYNC_CERT_SHA256=$SHA256" >> "$GITHUB_ENV"
          {
            echo "### Certificado do app"
            echo "Pacote: com.botsync.app"
            echo "- **SHA-1:** \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calcular versão do APK
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 12))
          VERSION_NAME="1.0.${VERSION_CODE}"

          echo "BS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Versão: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

      - name: Compilar release
        env:
          BOTSYNC_URL: ${{ vars.BOTSYNC_URL }}
          BOTSYNC_PINS: ${{ vars.BOTSYNC_PINS }}
          BS_KEYSTORE: ${{ runner.temp }}/botsync.jks
          BS_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          BS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          BS_VERSION_CODE: ${{ env.BS_VERSION_CODE }}
          BS_VERSION_NAME: ${{ env.BS_VERSION_NAME }}
        run: |
          if [ -z "$BOTSYNC_URL" ]; then
            echo "::error::Defina a variável BOTSYNC_URL."
            exit 1
          fi

          gradle --no-daemon :app:assembleRelease

      - name: Verificar assinatura do APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$AS" verify --verbose --print-certs "$APK" | head -12
          cp "$APK" BotSync.apk
          sha256sum BotSync.apk | tee BotSync.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BotSync-apk
          path: |
            BotSync.apk
            BotSync.apk.sha256
          retention-days: 3

      - name: Publicar em Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BotSync.apk
            BotSync.apk.sha256
